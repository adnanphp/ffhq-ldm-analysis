<!DOCTYPE html>
<html>
<head>
<title>Face Eval</title>
<style>
*{font-family:Arial,sans-serif;max-width:1200px;margin:0 auto;padding:0}
body{padding:20px;background:#f5f5f5}
h1{background:#2c3e50;color:#fff;padding:20px;text-align:center}
.images{display:flex;justify-content:center;gap:40px;margin:20px}
img{width:256px;height:256px;border:3px solid #ddd;border-radius:8px}
.rating{display:flex;gap:10px;margin:10px 0}
.rating span{padding:8px 12px;background:#fff;border-radius:5px;cursor:pointer;border:2px solid #ddd}
.rating span.sel{background:#3498db;color:#fff;border-color:#2980b9}
.artifacts{margin:10px 0}
.artifacts label{display:block}
button{background:#27ae60;color:#fff;padding:15px 30px;border:none;border-radius:8px;cursor:pointer;display:block;margin:20px auto}
</style>
</head>
<body>
<h1>Face Generation Quality Evaluation</h1>
<div id=app>
<p>Pair <span id=pair>1</span>/10</p>
<div class=images>
<div><img id=a><br>
<div class=rating id=ra></div>
<div class=artifacts id=aa></div></div>
<div><img id=b><br>
<div class=rating id=rb></div>
<div class=artifacts id=ab></div></div>
</div>
<button onclick=next()>Next →</button>
</div>
<script>
const pairs=[{a:'f1.png',b:'s1.png'},{a:'r1.png',b:'f2.png'},{a:'s3.png',b:'r2.png'},{a:'f3.png',b:'s2.png'},{a:'r3.png',b:'s3.png'},{a:'f4.png',b:'r4.png'},{a:'s2.png',b:'s4.png'},{a:'f5.png',b:'r5.png'},{a:'s2.png',b:'f6.png'},{a:'r6.png',b:'s4.png'}];
const crit=['realism','symmetry','proportion','coherence','artifacts','overall'];
let idx=0,ratings={a:{},b:{}},artifacts={a:[],b:[]},data=[],id='P'+Date.now().toString(36);
function render(i){const p=pairs[i];document.getElementById('a').src='stimuli/'+p.a;document.getElementById('b').src='stimuli/'+p.b;document.getElementById('pair').textContent=i+1;['a','b'].forEach(side=>{const r=document.getElementById('r'+side),art=document.getElementById('a'+side);r.innerHTML=crit.map(c=>`<span onclick="set('${side}','${c}',this)">${c[0].toUpperCase()}</span>`).join('');art.innerHTML=['blurry','asymmetry','distortion','color'].map(a=>`<label><input type=checkbox onchange="toggle('${side}','${a}')">${a}</label>`).join('');ratings[side]={};artifacts[side]=[];});}
function set(s,c,el){document.querySelectorAll('#r'+s+' span').forEach(e=>e.className='');el.className='sel';ratings[s][c]=1;}
function toggle(s,a){const cb=event.target;if(cb.checked){artifacts[s].push(a);}else{artifacts[s]=artifacts[s].filter(x=>x!==a);}}
function next(){data.push({pair:idx+1,images:pairs[idx],ratings:JSON.parse(JSON.stringify(ratings)),artifacts:JSON.parse(JSON.stringify(artifacts))});idx++;if(idx<10){render(idx);}else{const blob=new Blob([JSON.stringify({id,data})],{type:'application/json'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='eval.json';link.click();document.body.innerHTML='<h1>Done! Thank you</h1>';}}
render(0);
</script>
</body>
</html>
